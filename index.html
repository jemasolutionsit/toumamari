<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />

    <title>Touamamari – Tours en Rapa Nui (Isla de Pascua)</title>
    <meta name="description" content="Descubre los misterios de Rapa Nui con Touamamari. Tours arqueológicos, amanecer en Ahu Tongariki, Rano Raraku, Orongo y más. Guías locales, bilingual ES/EN." />
    <meta name="keywords" content="tours rapa nui, isla de pascua, toumamari, ahu tongariki, rano raraku, moais, hanga roa, turismo pascua, arqueología polinesia" />
    <meta name="author" content="Touamamari – Servicios Turísticos Touamamari SpA" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://toumamari.com/" />

    <!-- ═══ PWA / iOS Safari — CRITICO para "Añadir a pantalla de inicio" ═══ -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Toumamari" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://toumamari.com/" />
    <meta property="og:title" content="Touamamari – Tours en Rapa Nui" />
    <meta property="og:description" content="Tours arqueológicos exclusivos en Isla de Pascua. Amanecer en Ahu Tongariki, Rano Raraku, Orongo y experiencias personalizadas con guías locales." />
    <meta property="og:image" content="https://toumamari.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:site_name" content="Touamamari" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://toumamari.com/" />
    <meta name="twitter:title" content="Touamamari – Tours en Rapa Nui" />
    <meta name="twitter:description" content="Tours arqueológicos exclusivos en Isla de Pascua con guías locales." />
    <meta name="twitter:image" content="https://toumamari.com/og-image.jpg" />

    <!-- Structured Data — incluye teléfono para Google Business -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TouristInformationCenter",
      "name": "Touamamari",
      "alternateName": "Touamamari SpA",
      "description": "Tours arqueológicos y experiencias culturales en Rapa Nui (Isla de Pascua), Chile.",
      "url": "https://toumamari.com",
      "telephone": "+56957609175",
      "email": "info@touamamari.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Hanga Roa",
        "addressRegion": "Isla de Pascua",
        "addressCountry": "CL"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": -27.1507,
        "longitude": -109.4272
      },
      "sameAs": [
        "https://www.instagram.com/toumamari.rapanui",
        "https://www.facebook.com/toumamari"
      ]
    }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- ═══ Performance: preconnect y dns-prefetch ═══ -->
    <!-- Supabase: llamada para cargar tours y disponibilidad -->
    <link rel="preconnect" href="https://fdhwvzspdyethtiqcwqv.supabase.co" crossorigin />
    <!-- API tipo de cambio USD/CLP -->
    <link rel="dns-prefetch" href="https://mindicador.cl" />
    <!-- WhatsApp (checkout final) -->
    <link rel="dns-prefetch" href="https://wa.me" />

    <!-- Hero es el LCP: precargar antes de que React hidrate -->
    <link rel="preload" as="image" href="/hero-fondo.webp" fetchpriority="high" />

    <style>
      /* App Shell: se pinta antes de que React hidrate y lo reemplace. */
      #root:empty {
        min-height: 100svh;
        background: #0a0a0a;
      }
      #root:empty::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 50% 40%, rgba(255, 215, 0, 0.08), transparent 60%),
          #0a0a0a;
      }
      #root:empty::after {
        content: "";
        position: fixed;
        top: 50%;
        left: 50%;
        width: 42px;
        height: 42px;
        margin: -21px 0 0 -21px;
        border: 3px solid rgba(255, 215, 0, 0.2);
        border-top-color: #ffd700;
        border-radius: 50%;
        animation: shell-spin 0.9s linear infinite;
      }
      @keyframes shell-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #root:empty::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
